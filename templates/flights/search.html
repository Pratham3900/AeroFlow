{% extends "base.html" %}
{% load icons %}
{% load aeroflow_extras %}
{% block title %}Flight Status{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">{% icon "search" class_="text-primary" %} Check Flight Status</h4>
<div class="card shadow-sm mb-3">
  <div class="card-body">
    <form id="flight-search-form" action="{% url 'flights:search' %}" method="get" class="row g-2">
      <div class="col-md-3"><input type="text" name="q" value="{{ q }}" class="form-control" placeholder="Flight number"></div>
      <div class="col-md-3">
        <select name="origin" class="form-select">
          <option value="">Any Origin</option>
          {% for a in airports %}<option value="{{ a.code }}">{{ a.code }} - {{ a.city }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <select name="destination" class="form-select">
          <option value="">Any Destination</option>
          {% for a in airports %}<option value="{{ a.code }}">{{ a.code }} - {{ a.city }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-2">
        <select name="status" class="form-select">
          <option value="">Any Status</option>
          {% for value, label in status_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-1"><button class="btn btn-primary w-100">{% icon "search" %}</button></div>
    </form>
  </div>
</div>
<div id="flight-results">
  {% include "flights/_flight_table.html" %}
</div>
{% endblock %}
