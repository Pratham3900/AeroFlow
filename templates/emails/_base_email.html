<!DOCTYPE html>
<html>

    <div style="background:linear-gradient(90deg,#0b3d91,#1e88e5);padding:20px;color:#fff;">
      <h2 style="margin:0;">✈ AeroFlow Airlines</h2>
    </div>
    <div style="padding:24px;color:#222;">
      {% block body %}{% endblock %}
    </div>
    <div style="padding:14px 24px;background:#f4f6fa;color:#888;font-size:12px;">
      This is an automated message from AeroFlow. Please do not reply directly to this email.
    </div>
  </div>
</body>
</html>
