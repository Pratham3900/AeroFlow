{% extends "base.html" %}
{% load icons %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
  {% icon "exclamation-triangle" class_="display-1 text-danger" %}
  <h2 class="mt-3">Something went wrong</h2>
  <p class="text-muted">An unexpected error occurred. Our team has been notified.</p>
  <a href="{% url 'dashboard:home' %}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
